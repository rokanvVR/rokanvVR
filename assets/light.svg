<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-label="Premium developer profile banner">
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F8FAFC"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2563EB"><animate attributeName="stop-color" values="#2563EB;#06B6D4;#10B981;#2563EB" dur="9s" repeatCount="indefinite"/></stop>
    <stop offset=".5" stop-color="#06B6D4"><animate attributeName="stop-color" values="#06B6D4;#10B981;#2563EB;#06B6D4" dur="9s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#10B981"><animate attributeName="stop-color" values="#10B981;#2563EB;#06B6D4;#10B981" dur="9s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <linearGradient id="asciiGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#06B6D4"><animate attributeName="stop-color" values="#06B6D4;#2563EB;#06B6D4" dur="7s" repeatCount="indefinite"/></stop>
    <stop offset="1" stop-color="#2563EB"><animate attributeName="stop-color" values="#2563EB;#10B981;#2563EB" dur="7s" repeatCount="indefinite"/></stop>
  </linearGradient>
  <radialGradient id="orbA"><stop offset="0" stop-color="#2563EB" stop-opacity=".28"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></radialGradient>
  <radialGradient id="orbB"><stop offset="0" stop-color="#06B6D4" stop-opacity=".25"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></radialGradient>
  <radialGradient id="orbC"><stop offset="0" stop-color="#10B981" stop-opacity=".18"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/></radialGradient>
  <filter id="blur40"><feGaussianBlur stdDeviation="40"/></filter>
  <filter id="blur18"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="shadow"><feGaussianBlur in="SourceAlpha" stdDeviation="16"/><feOffset dy="12"/><feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="round"><rect width="1180" height="610" rx="30"/></clipPath>
  <clipPath id="terminalClip"><rect x="474" y="58" width="648" height="494" rx="24"/></clipPath>
  <pattern id="noise" width="120" height="120" patternUnits="userSpaceOnUse">
    <circle cx="7" cy="18" r=".7" fill="#FFFFFF" opacity=".05"/><circle cx="44" cy="93" r=".6" fill="#FFFFFF" opacity=".035"/>
    <circle cx="97" cy="51" r=".5" fill="#FFFFFF" opacity=".04"/><circle cx="113" cy="11" r=".4" fill="#FFFFFF" opacity=".03"/>
  </pattern>
  <style>
    .ascii {font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:15px;font-weight:700;fill:url(#asciiGrad);filter:url(#glow);opacity:0;animation:asciiIn 1.1s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*.12s);}
    .label {font:600 10px ui-monospace,SFMono-Regular,monospace;letter-spacing:2px;fill:#475569;}
    .value {font:500 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0F172A;}
    .role {font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:url(#accent);filter:url(#glow);}
    .pill rect {fill:#F8FAFC;stroke:rgba(15,23,42,.10);stroke-width:1;transition:none;}
    .pill text {font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0F172A;}
    .pill {animation:reveal .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d);}
    .fact {opacity:0;animation:reveal .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d);}
    .icon {fill:none;stroke:#475569;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;filter:url(#glow);}
    @keyframes reveal {from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
    @keyframes asciiIn {from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes float {0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  </style>
</defs>

<g clip-path="url(#round)">
  <rect width="1180" height="610" fill="url(#bgGrad)"/>
  <circle cx="180" cy="105" r="240" fill="url(#orbA)" filter="url(#blur40)">
    <animateTransform attributeName="transform" type="translate" values="0 0;45 22;0 0" dur="13s" repeatCount="indefinite"/>
  </circle>
  <circle cx="960" cy="120" r="260" fill="url(#orbB)" filter="url(#blur40)">
    <animateTransform attributeName="transform" type="translate" values="0 0;-35 35;0 0" dur="16s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="570" r="220" fill="url(#orbC)" filter="url(#blur40)">
    <animateTransform attributeName="transform" type="translate" values="0 0;30 -25;0 0" dur="18s" repeatCount="indefinite"/>
  </circle>

  <rect width="1180" height="610" fill="url(#noise)"/>
  <g opacity=".16">
    <rect x="-100" y="-30" width="1380" height="2" fill="#06B6D4">
      <animate attributeName="y" values="-30;640;-30" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.18;0" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Left identity panel -->
  <g filter="url(#shadow)">
    <rect x="58" y="58" width="370" height="494" rx="24" fill="#F8FAFC" fill-opacity=".66" stroke="rgba(15,23,42,.10)" stroke-width="1"/>
    <rect x="58" y="58" width="370" height="494" rx="24" fill="none" stroke="url(#accent)" stroke-opacity=".35"/>
  </g>

  <g style="animation:float 5s ease-in-out infinite">
    <text x="243" y="105" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" letter-spacing="3" fill="#475569">IDENTITY / 01</text>
    <g><text x="226" y="168" text-anchor="middle" class="ascii" style="--i:0"><tspan>          .-=========-.</tspan></text>
<text x="226" y="187" text-anchor="middle" class="ascii" style="--i:1"><tspan>       .-&#x27;             &#x27;-.</tspan></text>
<text x="226" y="206" text-anchor="middle" class="ascii" style="--i:2"><tspan>     .&#x27;     .-------.     &#x27;.</tspan></text>
<text x="226" y="225" text-anchor="middle" class="ascii" style="--i:3"><tspan>    /     .&#x27;  _   _  &#x27;.     \</tspan></text>
<text x="226" y="244" text-anchor="middle" class="ascii" style="--i:4"><tspan>   ;     /   (o) (o)   \     ;</tspan></text>
<text x="226" y="263" text-anchor="middle" class="ascii" style="--i:5"><tspan>   |    ;       ___       ;    |</tspan></text>
<text x="226" y="282" text-anchor="middle" class="ascii" style="--i:6"><tspan>   |    |      /___\      |    |</tspan></text>
<text x="226" y="301" text-anchor="middle" class="ascii" style="--i:7"><tspan>   ;    ;       \_/       ;    ;</tspan></text>
<text x="226" y="320" text-anchor="middle" class="ascii" style="--i:8"><tspan>    \    &#x27;.               .&#x27;    /</tspan></text>
<text x="226" y="339" text-anchor="middle" class="ascii" style="--i:9"><tspan>     &#x27;.    &#x27;._         _.&#x27;    .&#x27;</tspan></text>
<text x="226" y="358" text-anchor="middle" class="ascii" style="--i:10"><tspan>       &#x27;-.    &#x27;-------&#x27;    .-&#x27;</tspan></text>
<text x="226" y="377" text-anchor="middle" class="ascii" style="--i:11"><tspan>          &#x27;---.       .---&#x27;</tspan></text>
<text x="226" y="396" text-anchor="middle" class="ascii" style="--i:12"><tspan>              |       |</tspan></text>
<text x="226" y="415" text-anchor="middle" class="ascii" style="--i:13"><tspan>          .---&#x27;       &#x27;---.</tspan></text>
<text x="226" y="434" text-anchor="middle" class="ascii" style="--i:14"><tspan>        .&#x27;                 &#x27;.</tspan></text></g>
    <rect x="101" y="445" width="284" height="1" fill="url(#accent)" opacity=".18"/>
    <text x="243" y="475" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" letter-spacing="2" fill="#475569">BUILD • SHIP • ITERATE</text>
    <rect x="327" y="466" width="7" height="14" rx="1" fill="#06B6D4">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Terminal -->
  <g filter="url(#shadow)">
    <rect x="474" y="58" width="648" height="494" rx="24" fill="#F8FAFC" fill-opacity=".78" stroke="rgba(15,23,42,.10)" stroke-width="1"/>
    <rect x="474" y="58" width="648" height="494" rx="24" fill="none" stroke="url(#accent)" stroke-opacity=".32"/>
  </g>
  <g clip-path="url(#terminalClip)">
    <path d="M474 100H1122" stroke="rgba(15,23,42,.10)" />
    <circle cx="500" cy="79" r="4" fill="#2563EB" opacity=".75"/><circle cx="515" cy="79" r="4" fill="#06B6D4" opacity=".75"/><circle cx="530" cy="79" r="4" fill="#10B981" opacity=".75"/>
    <text x="1088" y="84" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" fill="#475569">PROFILE.EXE</text>

    <text x="620" y="133" font-family="ui-monospace,monospace" font-size="11" fill="#475569">$ whoami</text>
    <text x="620" y="154" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="26" font-weight="750" fill="#0F172A">Hi 👋 I'm {NAME}</text>
    <text x="620" y="164" class="role" opacity="0">Frontend Engineer<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.78;1" dur="16s" begin="0.0s" repeatCount="indefinite"/></text>
<text x="620" y="164" class="role" opacity="0">Full Stack Developer<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.78;1" dur="16s" begin="3.2s" repeatCount="indefinite"/></text>
<text x="620" y="164" class="role" opacity="0">Open Source Contributor<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.78;1" dur="16s" begin="6.4s" repeatCount="indefinite"/></text>
<text x="620" y="164" class="role" opacity="0">UI Engineer<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.78;1" dur="16s" begin="9.600000000000001s" repeatCount="indefinite"/></text>
<text x="620" y="164" class="role" opacity="0">AI Enthusiast<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.78;1" dur="16s" begin="12.8s" repeatCount="indefinite"/></text>
    <rect x="620" y="170" width="2" height="20" fill="#06B6D4">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <g class="fact" style="--d:1.7s"><text x="620" y="238" class="label">LOCATION</text><text x="750" y="238" class="value">Chennai, India</text></g>
<g class="fact" style="--d:2.02s"><text x="620" y="273" class="label">EDUCATION</text><text x="750" y="273" class="value">B.E. • Engineering</text></g>
<g class="fact" style="--d:2.34s"><text x="620" y="308" class="label">FOCUS</text><text x="750" y="308" class="value">AI · Web · Systems</text></g>
<g class="fact" style="--d:2.66s"><text x="620" y="343" class="label">PORTFOLIO</text><text x="750" y="343" class="value">yourportfolio.dev</text></g>
<g class="fact" style="--d:2.98s"><text x="620" y="378" class="label">EMAIL</text><text x="750" y="378" class="value">hello@example.com</text></g>

    <text x="620" y="395" font-family="ui-monospace,monospace" font-size="10" letter-spacing="2.5" fill="#475569">STACK / TOOLS</text>
    <g class="pill" style="--d:2.9s"><rect x="620" y="425" width="76" height="27" rx="13.5"/><text x="658.0" y="443" text-anchor="middle">React</text></g>
<g class="pill" style="--d:2.98s"><rect x="708" y="425" width="86" height="27" rx="13.5"/><text x="751.0" y="443" text-anchor="middle">Next.js</text></g>
<g class="pill" style="--d:3.06s"><rect x="806" y="425" width="88" height="27" rx="13.5"/><text x="850.0" y="443" text-anchor="middle">Node.js</text></g>
<g class="pill" style="--d:3.1399999999999997s"><rect x="906" y="425" width="100" height="27" rx="13.5"/><text x="956.0" y="443" text-anchor="middle">TypeScript</text></g>
<g class="pill" style="--d:3.2199999999999998s"><rect x="620" y="463" width="88" height="27" rx="13.5"/><text x="664.0" y="481" text-anchor="middle">Tailwind</text></g>
<g class="pill" style="--d:3.3s"><rect x="722" y="463" width="78" height="27" rx="13.5"/><text x="761.0" y="481" text-anchor="middle">Python</text></g>
<g class="pill" style="--d:3.38s"><rect x="812" y="463" width="80" height="27" rx="13.5"/><text x="852.0" y="481" text-anchor="middle">Docker</text></g>
<g class="pill" style="--d:3.46s"><rect x="904" y="463" width="102" height="27" rx="13.5"/><text x="955.0" y="481" text-anchor="middle">Postgres</text></g>
<g class="pill" style="--d:3.54s"><rect x="620" y="501" width="64" height="27" rx="13.5"/><text x="652.0" y="519" text-anchor="middle">AWS</text></g>
<g class="pill" style="--d:3.62s"><rect x="698" y="501" width="62" height="27" rx="13.5"/><text x="729.0" y="519" text-anchor="middle">Git</text></g>
<g class="pill" style="--d:3.7s"><rect x="772" y="501" width="70" height="27" rx="13.5"/><text x="807.0" y="519" text-anchor="middle">Figma</text></g>

    <g opacity=".8">
      <g class="icon" transform="translate(620 556)">
        <circle cx="0" cy="0" r="15"/><path d="M-6 2c0 4 3 7 7 7 4 0 7-3 7-7v-5c-2-2-4-3-7-3-4 0-7 3-7 8z"/>
      </g>
      <g class="icon" transform="translate(666 556)">
        <circle cx="0" cy="0" r="15"/><path d="M-7 8V-8h5v4c1-3 3-5 6-5 4 0 6 3 6 8V8h-5V0c0-2-1-4-3-4-3 0-4 2-4 5v7z"/>
      </g>
      <g class="icon" transform="translate(712 556)">
        <circle cx="0" cy="0" r="15"/><path d="M-8-5c2-3 5-4 8-4 4 0 7 2 9 5M-9 1c3-2 6-3 9-3 3 0 6 1 9 3M-7 7c2-1 4-1 7-1 2 0 5 0 7 1"/>
      </g>
      <g class="icon" transform="translate(758 556)">
        <circle cx="0" cy="0" r="15"/><path d="M-7-2l7-7 7 7M-6-3v10h12V-3"/>
      </g>
    </g>

    <!-- animated glass reflection -->
    <path d="M455 90 L610 50 L780 552 L650 552 Z" fill="#FFFFFF" opacity=".018">
      <animateTransform attributeName="transform" type="translate" values="-180 0;500 0;-180 0" dur="12s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Border shimmer -->
  <rect x="3" y="3" width="1174" height="604" rx="29" fill="none" stroke="url(#accent)" stroke-width="1.2" stroke-dasharray="90 1100" opacity=".7">
    <animate attributeName="stroke-dashoffset" values="0;-2380" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- particles -->
  <g fill="#06B6D4">
    <circle cx="34" cy="170" r="1.2"><animateMotion dur="8s" repeatCount="indefinite" path="M0 0 C120 -60 180 90 250 0"/></circle>
    <circle cx="1140" cy="330" r="1"><animateMotion dur="10s" repeatCount="indefinite" path="M0 0 C-100 70 -160 -60 -240 30"/></circle>
    <circle cx="448" cy="580" r="1.1"><animate attributeName="opacity" values=".1;.8;.1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="84" cy="530" r=".8"><animate attributeName="opacity" values=".1;.7;.1" dur="2.5s" repeatCount="indefinite"/></circle>
  </g>
</g>
</svg>